<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Catal the cat — hardware mascot">
  <title>Catal the hardware cat</title>
  <defs>
    <linearGradient id="cat-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A88A14"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="220" rx="62" ry="8" fill="#0B0B0F" opacity=".08"/>

  <!-- tail curled -->
  <path d="M178 178c18 0 30-12 30-28-12 0-24 8-30 18" stroke="url(#cat-body)" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- body -->
  <path d="M68 168c0-32 24-60 52-60s52 28 52 60c0 8-2 18-6 24H74c-4-6-6-16-6-24Z" fill="url(#cat-body)"/>

  <!-- legs -->
  <rect x="84" y="184" width="14" height="20" rx="3" fill="#A88A14"/>
  <rect x="142" y="184" width="14" height="20" rx="3" fill="#A88A14"/>

  <!-- head -->
  <path d="M70 116c0-32 22-58 50-58s50 26 50 58c0 22-22 42-50 42s-50-20-50-42Z" fill="url(#cat-body)"/>

  <!-- ears -->
  <path d="M72 78l4-44 30 24Z" fill="url(#cat-body)"/>
  <path d="M168 78l-4-44-30 24Z" fill="url(#cat-body)"/>
  <path d="M82 70l4-22 16 12Z" fill="#FF6B5B" opacity=".7"/>
  <path d="M158 70l-4-22-16 12Z" fill="#FF6B5B" opacity=".7"/>

  <!-- eyes -->
  <ellipse cx="100" cy="106" rx="6" ry="9" fill="#1F8A5C"/>
  <ellipse cx="140" cy="106" rx="6" ry="9" fill="#1F8A5C"/>
  <ellipse cx="100" cy="106" rx="2" ry="6" fill="#0B0B0F"/>
  <ellipse cx="140" cy="106" rx="2" ry="6" fill="#0B0B0F"/>

  <!-- nose -->
  <path d="M120 124l-6 6h12l-6-6Z" fill="#FF6B5B"/>

  <!-- mouth -->
  <path d="M120 130v6 M120 136c-3 4-8 4-11 1 M120 136c3 4 8 4 11 1" stroke="#0B0B0F" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- whiskers -->
  <path d="M88 132h-14 M88 138h-12 M152 132h14 M152 138h12" stroke="#0B0B0F" stroke-width="1.5" stroke-linecap="round"/>

  <!-- bolt prop -->
  <g transform="translate(178 158) rotate(30)">
    <rect x="-6" y="-14" width="12" height="28" rx="2" fill="#9B9B9"/>
    <path d="M-6 -14h12v-6h-12z M-6 14h12v6h-12z" fill="#9B9B9"/>
    <rect x="-3" y="-4" width="6" height="8" fill="#0B0B0F"/>
  </g>
</svg>