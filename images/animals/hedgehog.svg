    <path d="M60 130l-6-22 12 8Z M76 110l-2-26 14 10Z M96 96l2-28 14 14Z M120 92l4-30 12 18Z M144 96l8-28 10 18Z M168 110l12-26 6 18Z M186 130l16-22 4 18Z"/>
  </g>

  <!-- body -->
  <path d="M58 156c0-32 28-58 62-58s62 26 62 58c0 22-20 38-48 38-12 0-22-2-30-2-10 0-20 4-32 4-6 0-14-2-14-12Z" fill="url(#hedge-body)"/>

  <!-- belly -->
