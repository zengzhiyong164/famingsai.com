  <!-- feet -->
  <ellipse cx="92" cy="206" rx="10" ry="6" fill="#5B5B57"/>
  <ellipse cx="148" cy="206" rx="10" ry="6" fill="#5B5B57"/>

  <!-- shield prop -->
