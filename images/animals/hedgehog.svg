  <circle cx="148" cy="156" r="4" fill="#0B0B0F"/>
  <circle cx="110" cy="154" r="1.5" fill="#F4F4F1"/>
  <circle cx="150" cy="154" r="1.5" fill="#F4F4F1"/>

  <!-- cheek -->
  <circle cx="100" cy="172" r="5" fill="#FF6B5B" opacity=".5"/>
  <circle cx="156" cy="172" r="5" fill="#FF6B5B" opacity=".5"/>

  <!-- smile -->
