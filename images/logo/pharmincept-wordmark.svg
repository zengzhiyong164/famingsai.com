<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="PHARMINCEPT wordmark">
  <title>PHARMINCEPT wordmark</title>
  <defs>
    <linearGradient id="pw-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C69D4"/>
      <stop offset="100%" stop-color="#0E3F82"/>
    </linearGradient>
    <linearGradient id="pw-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A88A14"/>
    </linearGradient>
  </defs>

  <!-- mark on left -->
  <g transform="translate(20 20)">
    <path d="M80 8 L144 44 L144 124 L80 160 L16 124 L16 44 Z"
          fill="none" stroke="url(#pw-blue)" stroke-width="10" stroke-linejoin="round"/>
    <g transform="translate(80 84)">
      <circle r="38" fill="none" stroke="#0B0B0F" stroke-width="7"/>
      <g fill="#0B0B0F">
        <rect x="-4" y="-54" width="8" height="15" rx="2"/>
        <rect x="-4" y="39"  width="8" height="15" rx="2"/>
        <rect x="-54" y="-4" width="15" height="8" rx="2"/>
        <rect x="39"  y="-4" width="15" height="8" rx="2"/>
        <rect x="-30" y="-46" width="8" height="15" rx="2" transform="rotate(-45)"/>
        <rect x="22"  y="-46" width="8" height="15" rx="2" transform="rotate(45)"/>
        <rect x="-30" y="31"  width="8" height="15" rx="2" transform="rotate(45)"/>
        <rect x="22"  y="31"  width="8" height="15" rx="2" transform="rotate(-45)"/>
      </g>
    </g>
    <g transform="translate(80 84)">
      <path d="M0 -22 L19 -11 L19 11 L0 22 L-19 11 L-19 -11 Z" fill="url(#pw-gold)"/>
      <path d="M0 -10 L10 -5 L10 5 L0 10 L-10 5 L-10 -5 Z" fill="#0B0B0F"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(190 130)" fill="#0B0B0F" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="800" letter-spacing="-2">
    <text font-size="42">PHARMINCEPT</text>
  </g>
  <g transform="translate(192 158)" fill="#5B5B57" font-family="Inter, system-ui, sans-serif" font-weight="500" letter-spacing="6">
    <text font-size="14">INDUSTRIAL CO., LIMITED</text>
  </g>
</svg>