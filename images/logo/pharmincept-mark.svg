<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="PHARMINCEPT mark" class="brand-mark">
  <title>PHARMINCEPT mark</title>
  <defs>
    <linearGradient id="pm-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C69D4"/>
      <stop offset="100%" stop-color="#0E3F82"/>
    </linearGradient>
    <linearGradient id="pm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A88A14"/>
    </linearGradient>
  </defs>

  <!-- Hex outer ring: industrial / sourcing -->
  <path d="M120 16 L208 64 L208 176 L120 224 L32 176 L32 64 Z"
        fill="none" stroke="url(#pm-blue)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner gear silhouette: industrial / machinery -->
  <g transform="translate(120 120)">
    <circle r="56" fill="none" stroke="#0B0B0F" stroke-width="10"/>
    <g fill="#0B0B0F">
      <rect x="-6" y="-78" width="12" height="22" rx="3"/>
      <rect x="-6" y="56"  width="12" height="22" rx="3"/>
      <rect x="-78" y="-6" width="22" height="12" rx="3"/>
      <rect x="56"  y="-6" width="22" height="12" rx="3"/>
      <rect x="-44" y="-66" width="12" height="22" rx="3" transform="rotate(-45)"/>
      <rect x="32"  y="-66" width="12" height="22" rx="3" transform="rotate(45)"/>
      <rect x="-44" y="44"  width="12" height="22" rx="3" transform="rotate(45)"/>
      <rect x="32"  y="44"  width="12" height="22" rx="3" transform="rotate(-45)"/>
    </g>
  </g>

  <!-- Center hex dot: pharma-derived mark -->
  <g transform="translate(120 120)">
    <path d="M0 -32 L27 -16 L27 16 L0 32 L-27 16 L-27 -16 Z"
          fill="url(#pm-gold)"/>
    <path d="M0 -16 L14 -8 L14 8 L0 16 L-14 8 L-14 -8 Z"
          fill="#0B0B0F"/>
  </g>
</svg>